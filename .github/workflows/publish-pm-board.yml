name: Publish pm-board package

on:
  push:
    branches: [main]
    paths:
      - "packages/pm-board/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://npm.pkg.github.com
          scope: "@hwanys2"
      - run: npm ci
      - run: npm run build -w packages/pm-board
      - run: npm publish -w packages/pm-board --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
